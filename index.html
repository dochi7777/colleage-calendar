<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9ddcf5" />
    <meta name="description" content="수업, 과제, 대외활동과 동아리 일정을 한곳에서 관리하는 대학생 플래너" />
    <title>몽글플랜 | 대학생 시간 관리</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M29 28C20 8 4 10 7 28c2 13 15 9 22 5M35 28c9-20 25-18 22 0-2 13-15 9-22 5' fill='%239ddcf5' stroke='%2338566f' stroke-width='5'/%3E%3Ccircle cx='32' cy='31' r='8' fill='white' stroke='%2338566f' stroke-width='5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="paper-noise" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="몽글플랜 홈">
          <svg class="brand-ribbon" viewBox="0 0 58 42" aria-hidden="true">
            <path d="M27 18C20 4 5 3 4 16c-1 11 12 14 23 7Z" />
            <path d="M31 18C38 4 53 3 54 16c1 11-12 14-23 7Z" />
            <path d="m22 25-7 14 13-5m8-9 7 14-13-5" />
            <rect x="23" y="16" width="12" height="12" rx="5" />
          </svg>
          <span>몽글플랜</span>
        </a>
        <nav class="main-nav" aria-label="주요 메뉴">
          <button class="nav-item active" data-view="today">오늘</button>
          <button class="nav-item" data-view="schedule">시간표</button>
          <button class="nav-item" data-view="activities">대외활동</button>
          <button class="nav-item" data-view="clubs">동아리</button>
          <button class="nav-item" data-view="assignments">과제</button>
        </nav>
        <button class="round-button" id="settingsButton" aria-label="테마 설정">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.86 1.86-.06-.06A1.7 1.7 0 0 0 16 18.4a1.7 1.7 0 0 0-1 1.55V20h-2.63v-.08A1.7 1.7 0 0 0 11.3 18.4a1.7 1.7 0 0 0-1.88.34l-.06.06-1.86-1.86.06-.06A1.7 1.7 0 0 0 7.9 15a1.7 1.7 0 0 0-1.55-1H6.3v-2.63h.08A1.7 1.7 0 0 0 7.9 10.3a1.7 1.7 0 0 0-.34-1.88l-.06-.06L9.36 6.5l.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1-1.55V5.3h2.63v.08A1.7 1.7 0 0 0 16 6.9a1.7 1.7 0 0 0 1.88-.34l.06-.06 1.86 1.86-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.55 1H21V14h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg>
        </button>
      </header>

      <main>
        <section class="view active" id="today" aria-labelledby="todayTitle">
          <div class="welcome-card stitched">
            <div class="welcome-copy">
              <p class="eyebrow" id="todayDate"></p>
              <h1 id="todayTitle"><span id="greeting">좋은 아침!</span><br />오늘도 차근차근 해볼까요?</h1>
              <p class="welcome-note"><span class="tiny-bow" aria-hidden="true"></span> 오늘의 여유 시간은 <strong id="freeTime">3시간 20분</strong>이에요.</p>
              <button class="primary-button" data-open-modal>
                <span aria-hidden="true">＋</span> 새 일정 추가하기
              </button>
            </div>
            <div class="character-wrap">
              <span class="hand-note">할 수 있어!</span>
              <img src="assets/student-character.png" alt="노트와 연필을 든 대학생 캐릭터" />
            </div>
            <span class="button-pin pin-one" aria-hidden="true"></span>
            <span class="button-pin pin-two" aria-hidden="true"></span>
            <span class="button-pin pin-three" aria-hidden="true"></span>
          </div>

          <div class="dashboard-grid">
            <section class="panel today-panel">
              <div class="panel-heading">
                <div>
                  <p class="label">TODAY</p>
                  <h2>오늘의 일정</h2>
                </div>
                <span class="date-chip" id="dateChip"></span>
              </div>
              <div class="timeline" id="todayTimeline"></div>
            </section>

            <aside class="side-stack">
              <section class="panel assignment-panel">
                <div class="panel-heading compact">
                  <div>
                    <p class="label">TO-DO</p>
                    <h2>다가오는 과제</h2>
                  </div>
                  <button class="text-button" data-go="assignments">전체보기</button>
                </div>
                <div class="assignment-list" id="assignmentPreview"></div>
              </section>

              <section class="panel focus-panel stitched">
                <div>
                  <p class="label">FOCUS</p>
                  <h2>이번 주 집중도</h2>
                  <p><strong id="focusPercent">68%</strong> 지난주보다 12% 더 부지런해요!</p>
                </div>
                <div class="focus-ring" aria-label="이번 주 집중도 68%"><span>68<small>%</small></span></div>
                <span class="ribbon-corner" aria-hidden="true"></span>
              </section>
            </aside>
          </div>
        </section>

        <section class="view" id="schedule" aria-labelledby="scheduleTitle">
          <div class="section-title">
            <div><p class="label">WEEKLY CLASS</p><h1 id="scheduleTitle">나의 수강 시간표</h1></div>
            <button class="primary-button" data-open-modal data-type="수업"><span aria-hidden="true">＋</span> 수업 추가</button>
          </div>
          <div class="schedule-card panel">
            <div class="schedule-grid" id="scheduleGrid"></div>
            <span class="sewn-button sky-button" aria-hidden="true"></span>
          </div>
        </section>

        <section class="view" id="activities" aria-labelledby="activitiesTitle">
          <div class="section-title"><div><p class="label">ACTIVITIES</p><h1 id="activitiesTitle">대외활동 보관함</h1></div><button class="primary-button" data-open-modal data-type="대외활동"><span aria-hidden="true">＋</span> 활동 추가</button></div>
          <div class="card-grid" id="activityGrid"></div>
        </section>

        <section class="view" id="clubs" aria-labelledby="clubsTitle">
          <div class="section-title"><div><p class="label">CLUB LIFE</p><h1 id="clubsTitle">동아리 일정</h1></div><button class="primary-button" data-open-modal data-type="동아리"><span aria-hidden="true">＋</span> 일정 추가</button></div>
          <div class="club-layout"><div class="card-grid" id="clubGrid"></div><aside class="panel memo"><p class="label">MEMO</p><h2>동아리 메모</h2><textarea id="clubMemo" aria-label="동아리 메모" placeholder="준비물이나 아이디어를 적어두세요."></textarea><span class="tape" aria-hidden="true"></span><span class="sewn-button pink-button" aria-hidden="true"></span></aside></div>
        </section>

        <section class="view" id="assignments" aria-labelledby="assignmentsTitle">
          <div class="section-title"><div><p class="label">ASSIGNMENTS</p><h1 id="assignmentsTitle">과제 체크리스트</h1></div><button class="primary-button" data-open-modal data-type="과제"><span aria-hidden="true">＋</span> 과제 추가</button></div>
          <div class="panel task-board">
            <div class="task-summary"><span><b id="remainingCount">0</b>개 남음</span><div class="progress"><i id="taskProgress"></i></div><span id="donePercent">0%</span></div>
            <div id="assignmentBoard"></div>
            <span class="sewn-button yellow-button" aria-hidden="true"></span>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
        <div class="modal-ribbon" aria-hidden="true"><span></span><i></i><b></b></div>
        <p class="label" id="modalLabel">NEW PLAN</p>
        <h2 id="modalTitle">새 일정 추가</h2>
        <form id="planForm">
          <input id="editId" type="hidden" />
          <label>분류<select id="planType" required><option>수업</option><option>과제</option><option>대외활동</option><option>동아리</option></select></label>
          <label>일정 이름<input id="planTitle" type="text" placeholder="예: 전공 레포트 마감" maxlength="40" required /></label>
          <div class="form-row"><label>날짜<input id="planDate" type="date" required /></label><label>시간<input id="planTime" type="time" required /></label></div>
          <div class="form-row class-fields" id="classFields"><label>요일<select id="planDay"><option value="1">월요일</option><option value="2">화요일</option><option value="3">수요일</option><option value="4">목요일</option><option value="5">금요일</option></select></label><label>수업 시간<select id="planDuration"><option value="1">1시간</option><option value="2" selected>2시간</option><option value="3">3시간</option></select></label></div>
          <label>메모<input id="planNote" type="text" placeholder="장소나 준비물을 적어주세요" maxlength="60" /></label>
          <button class="primary-button submit-button" id="submitButton" type="submit">일정 저장하기</button>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite">일정을 저장했어요!</div>
    <script src="script.js"></script>
  </body>
</html>
